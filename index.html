<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Đăng nhập · Study Planner</title>
<link href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link href="shared.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
</head>
<body style="visibility:hidden">
<div class="min-vh-100 d-flex align-items-center justify-content-center p-3">
  <div class="card p-4" style="width:min(420px,100%)">
    <div class="logo fs-3 text-center mb-1">✦ STUDY PLANNER</div>
    <p class="text-center text-secondary small mb-3">Lên kế hoạch học tập nhẹ nhàng, rõ ràng</p>
    <ul class="nav nav-pills nav-fill pill-tabs mb-3">
      <li class="nav-item"><button class="nav-link active" data-m="login">Đăng nhập</button></li>
      <li class="nav-item"><button class="nav-link" data-m="signup">Tạo tài khoản</button></li>
    </ul>
    <div id="f"></div>
    <button class="btn btn-main w-100 py-2" id="go"></button>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="shared.js"></script>
<script>
let mode = 'login';
// Đã đăng nhập từ trước -> vào thẳng trang chính
sb.auth.getSession().then(({ data }) => {
  if (data.session) location.replace('studyplanner.html');
  else document.body.style.visibility = 'visible';
}).catch(() => document.body.style.visibility = 'visible');

function draw() {
  const lg = mode === 'login';
  $('#f').innerHTML =
    (lg ? '' : `<label class="form-label small fw-semibold text-secondary" for="nm">Tên của bạn</label><input class="form-control mb-3" id="nm" placeholder="Nguyễn Văn A" autocomplete="name">`) +
    `<label class="form-label small fw-semibold text-secondary" for="em">Email</label><input type="email" class="form-control mb-3" id="em" placeholder="ban@email.com" autocomplete="email">` +
    pw('pw', 'Mật khẩu', 'Tối thiểu 6 ký tự', lg ? 'current-password' : 'new-password') +
    (lg ? '' : pw('pw2', 'Nhập lại mật khẩu', '', 'new-password'));
  $('#go').innerHTML = lg ? '<i class="bi bi-box-arrow-in-right me-1"></i> Đăng nhập' : '<i class="bi bi-person-plus me-1"></i> Tạo tài khoản';
  document.querySelectorAll('[data-m]').forEach(b => b.classList.toggle('active', b.dataset.m === mode));
}
document.querySelectorAll('[data-m]').forEach(b => b.onclick = () => { mode = b.dataset.m; draw(); });
document.addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.closest('#f')) $('#go').click(); });

$('#go').onclick = async () => {
  const em = $('#em').value.trim(), p = $('#pw').value, btn = $('#go'), old = btn.innerHTML;
  if (!em || p.length < 6) return toast('Nhập email và mật khẩu (tối thiểu 6 ký tự)', 'warning');
  if (mode === 'signup' && p !== $('#pw2').value) return toast('Hai mật khẩu chưa giống nhau', 'warning');
  btn.disabled = true; btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>Đang xử lý...';
  try {
    if (mode === 'login') {
      const { error } = await sb.auth.signInWithPassword({ email: em, password: p });
      if (error) throw error;
    } else {
      const name = $('#nm').value.trim() || em.split('@')[0];
      const { data, error } = await sb.auth.signUp({ email: em, password: p, options: { data: { name } } });
      if (error) throw error;
      if (!data.session) { toast('Đã tạo tài khoản! Hãy kiểm tra email để xác nhận rồi đăng nhập.', 'info'); mode = 'login'; draw(); btn.disabled = false; return; }
    }
    toast('Thành công! Đang vào Study Planner...');
    setTimeout(() => location.replace('studyplanner.html'), 600);
  } catch (err) {
    toast(viErr(err.message), 'danger');
    btn.disabled = false; btn.innerHTML = old;
  }
};
draw();
</script>
</body>
</html>
