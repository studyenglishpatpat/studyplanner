<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Study Planner</title>
<link rel="icon" type="image/x-icon" href="favicon.png">
<link href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link href="shared.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
#loader{position:fixed;inset:0;z-index:3000;background:linear-gradient(135deg,#efe9fb,#e4effc 55%,#fde8ef);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;transition:opacity .5s}
#loader.hide{opacity:0;pointer-events:none}
#loader .logo{font-size:clamp(28px,6vw,46px)}
.ld{width:180px;height:4px;background:#e0d9f0;border-radius:4px;overflow:hidden}
.ld u{display:block;width:45%;height:100%;border-radius:4px;background:linear-gradient(90deg,#b9a8e0,#e58fb3);animation:ld 1.1s ease-in-out infinite alternate}
@keyframes ld{from{transform:translateX(-5%)}to{transform:translateX(125%)}}
#tc{top:64px!important}
.glass{background:rgba(255,255,255,.5);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-bottom:1px solid rgba(255,255,255,.8);height:60px}
.ic{position:relative;width:40px;height:40px;border-radius:14px;background:#e7f4f1;color:#3b8f84;border:0;font-size:18px;padding:0}
.ic .badge{position:absolute;top:-5px;right:-5px;background:#f0788f}
.av{width:40px;height:40px;border-radius:50%;border:2px solid #b9a8e0;background:#f3eefc;padding:0;overflow:hidden;animation:avbob 2.8s ease-in-out infinite}
.av img{width:100%;height:100%;object-fit:cover;display:block}
@keyframes avbob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
@media(prefers-reduced-motion:reduce){.av{animation:none}}
.hnav button.homebtn{padding:0 4px 0 0;background:none;box-shadow:none;transition:transform .2s}.hnav button.homebtn:hover{transform:scale(1.05)}
.hdiv{width:1px;height:24px;background:#d9d0ee;margin:0 6px}
.note-i{padding:9px 10px;border-radius:12px;font-size:14px;display:flex;align-items:center;gap:8px}.note-i:hover{background:#f8f5fd}#notes{max-height:70vh;overflow-y:auto}
.side{position:fixed;top:60px;left:0;bottom:0;width:200px;padding:18px 14px;background:rgba(255,255,255,.35);backdrop-filter:blur(10px);z-index:10;--bs-nav-pills-link-active-bg:#fff;--bs-nav-pills-link-active-color:var(--pu)}
.side .nav-link{color:var(--mut);font-weight:500;border-radius:14px;padding:12px 14px;margin-bottom:8px;text-align:left}
.side .nav-link.active{box-shadow:0 4px 14px rgba(126,106,168,.15);font-weight:600}
main{margin:78px 22px 24px 222px;max-width:1300px}
.hero{background:linear-gradient(135deg,#f3eefc,#e4effc 60%,#fde8ef)!important}
.ring{position:relative;width:104px;height:104px;border-radius:50%;background:conic-gradient(#8fd0b0 calc(var(--p)*1%),#ece7f7 0);display:grid;place-items:center;flex:none}
.ring::before{content:'';position:absolute;inset:10px;background:#fff;border-radius:50%}.ring span{position:relative;font-weight:700;font-size:22px;color:var(--pu)}
.pill{border-radius:99px;padding:6px 14px;font-weight:600;font-size:14px}
.s1{background:#e1ecfd;color:#3c6fb0}.s2{background:#d8f2e3;color:#2e7a54}.s3{background:#fde3ec;color:#b0486b}
.stat{border-radius:18px;padding:14px;text-align:center}.stat small{display:block;font-weight:600;letter-spacing:.04em;text-transform:uppercase;font-size:12px}.stat b{font-size:32px}
.rw{display:grid;grid-template-columns:130px 1fr auto auto;gap:12px;align-items:center;padding:12px 14px;border-radius:16px;margin-bottom:10px;background:#fff;border-left:5px solid var(--c);box-shadow:0 2px 10px rgba(126,106,168,.07)}
.todo{--c:#f4a9c0}.doing{--c:#f5cd8a}.done{--c:#8fd0b0}.skip{--c:#c9c3dc}
.rw.now{box-shadow:0 0 0 2px #b9a8e0,0 4px 16px rgba(126,106,168,.18)}
.tmp{background:#f3eefc;color:var(--pu);border-radius:10px;padding:4px 10px;font-weight:600;font-size:13px;white-space:nowrap;display:inline-block}
.rw small,.wc small{color:var(--mut)}.tt{cursor:pointer}.rw.done .tt b{text-decoration:line-through;color:var(--mut)}
.sbj{display:inline-block;border-radius:99px;padding:2px 10px;font-size:12px;font-weight:600;margin:3px 4px 0 0}
.st{width:auto;border:0;border-radius:99px;font-weight:600;font-size:13px;cursor:pointer}
.st-todo{background-color:#fde3ec;color:#b0486b}.st-doing{background-color:#ffeccf;color:#a8701f}.st-done{background-color:#d8f2e3;color:#2e7a54}.st-skip{background-color:#e9e6f2;color:#7b7494}
.week{display:grid;grid-template-columns:repeat(7,minmax(175px,1fr));gap:10px;overflow-x:auto;padding-bottom:6px}
.col7{background:rgba(255,255,255,.76);border:1px solid #fff;border-radius:18px;padding:10px;min-height:260px}.col7.now{background:#fff6e6;border-color:#ffd9a0}
.wc{background:#fff;border-radius:12px;padding:9px;margin-bottom:8px;display:grid;gap:6px;font-size:14px;border-left:4px solid var(--c)}.wc b{cursor:pointer}
.add{width:100%;border:1.5px dashed #cfc4ea;background:none;border-radius:12px;padding:4px;color:var(--mut)}
.thp th{background:#7e6aa8;color:#fff;font-weight:600;white-space:nowrap}.table{--bs-table-bg:transparent}.table td{background:#fff}tr.now td{background:#f3eefc}
.table td input{border:0;background:#eef3fd;border-radius:8px}
.empty{text-align:center;color:var(--mut);padding:28px}
.modal-content{border:0;border-radius:1.25rem}
.hnav{display:flex;align-items:center;gap:6px}.hnav button{border:0;background:none;border-radius:12px;padding:8px 14px;font-weight:600;color:var(--mut)}
.hnav button.on{background:#fff;color:var(--pu);box-shadow:0 3px 10px rgba(126,106,168,.15)}#crumb{color:var(--mut);margin-left:6px;font-weight:500}
.s4{background:#ece9f3;color:#7b7494}.s5{background:#ffeccf;color:#a8701f}.s6{background:#ece6fb;color:#6a55a0}.kp b{font-size:28px}
@media(max-width:800px){.hnav button{padding:6px 10px;font-size:14px}#crumb{display:none}}
@media(max-width:640px){.bt,.hdiv{display:none}}
@media(max-width:520px){.hnav button[data-hn] span{display:none}}
.mgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:8px}
.mh{text-align:center;font-weight:700;font-size:13px;color:#6b6585;padding:6px 0}.mh.cn{color:#f08a3c}
.mc{border:2px solid transparent;border-radius:14px;background:#fff;min-height:82px;padding:6px 4px;text-align:center;font-weight:600;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--ink);transition:.15s}
.mc.has{background:#ece6fb}.mc.today{border-color:var(--pu)}.mc.cn .n{color:#f08a3c}.mc.out{visibility:hidden;cursor:default}
.mc:not(.out):hover{transform:translateY(-2px);box-shadow:0 6px 16px rgba(126,106,168,.2)}
.mc small{font-size:11px;color:var(--mut);font-weight:500}
.dots{display:flex;gap:3px;flex-wrap:wrap;justify-content:center}.dot{width:8px;height:8px;border-radius:50%;background:var(--c);display:inline-block}
.dc{background:#fff;border-radius:14px;border-left:5px solid var(--c);padding:12px;margin-bottom:10px;box-shadow:0 2px 10px rgba(126,106,168,.08)}
@media(max-width:800px){.mgrid{gap:4px}.mc{min-height:58px;font-size:14px}.mc small{display:none}.side .nav-link i{display:block;margin:0 0 2px!important}.side .nav-link{font-size:11px!important}}
@media(max-width:800px){.side{top:auto;bottom:0;width:auto;right:0;height:64px;padding:8px;background:rgba(255,255,255,.8)}.side .nav{flex-direction:row!important;gap:6px}.side .nav-link{margin:0;text-align:center;flex:1;padding:8px;font-size:13px}main{margin:76px 12px 82px}.rw{grid-template-columns:1fr auto}.rw .tmp{grid-column:1/3;justify-self:start}.brand{display:none}#tc{left:0;right:0}.toast{min-width:0;width:100%}}
</style>
</head>
<body>
<!-- Màn hình chờ che giao diện cho tới khi kiểm tra xong đăng nhập -->
<div id="loader"><div class="logo">✦ STUDY PLANNER</div><div class="ld"><u></u></div></div>

<nav class="glass fixed-top px-3 d-flex justify-content-between align-items-center">
  <div class="hnav"><button class="homebtn" data-act="home" title="Về trang chủ"><span class="logo fs-5">✦ <span class="bt">STUDY PLANNER</span></span></button><span class="hdiv"></span><button data-hn="manage"><i class="bi bi-grid-1x2-fill"></i> <span>Quản lý</span></button><button data-hn="stats"><i class="bi bi-bar-chart-line-fill"></i> <span>Thống kê</span></button><span id="crumb"></span></div>
  <div class="d-flex align-items-center gap-2">
    <button class="btn ic" data-act="cal" title="Việc còn lại trong tuần"><i class="bi bi-calendar-week"></i><span id="bWeek" class="badge rounded-pill d-none"></span></button>
    <div class="dropdown">
      <button class="btn ic" data-bs-toggle="dropdown" data-bs-auto-close="outside" title="Thông báo"><i class="bi bi-bell-fill"></i><span id="bBell" class="badge rounded-pill d-none"></span></button>
      <div class="dropdown-menu dropdown-menu-end p-2 border-0 shadow rounded-4" style="width:320px" id="notes"></div>
    </div>
    <div class="dropdown">
      <button class="btn av" id="avatar" data-bs-toggle="dropdown" title="Tài khoản"><img src="favicon.png" alt="Tài khoản"></button>
      <ul class="dropdown-menu dropdown-menu-end border-0 shadow rounded-4 p-2">
        <li class="px-3 py-2"><div id="uName" class="fw-semibold"></div><small id="uMail" class="text-secondary"></small></li>
        <li><hr class="dropdown-divider"></li>
        <li><button class="dropdown-item rounded-3" data-act="subs"><i class="bi bi-tags me-2"></i>Quản lý nhóm môn</button></li>
        <li><button class="dropdown-item rounded-3" data-act="perm"><i class="bi bi-bell me-2"></i>Bật nhắc nhở trên máy</button></li>
        <li><button class="dropdown-item rounded-3" data-act="pw"><i class="bi bi-key me-2"></i>Đổi mật khẩu</button></li>
        <li><button class="dropdown-item rounded-3 text-danger" data-act="out"><i class="bi bi-box-arrow-right me-2"></i>Đăng xuất</button></li>
      </ul>
    </div>
    
  </div>
</nav>

<aside class="side"><div class="nav nav-pills flex-column">
  <button class="nav-link" data-tab="today"><i class="bi bi-house-heart me-2"></i>Hôm nay</button>
  <button class="nav-link" data-tab="week"><i class="bi bi-calendar3-week me-2"></i>Tuần này</button>
  <button class="nav-link" data-tab="month"><i class="bi bi-calendar3 me-2"></i>Tháng này</button>
  <button class="nav-link" data-tab="list"><i class="bi bi-check2-square me-2"></i>Checklist</button>
</div></aside>

<main id="view"></main>

<!-- Modal thêm / sửa việc -->
<div class="modal fade" id="mTask" tabindex="-1"><div class="modal-dialog modal-dialog-centered"><div class="modal-content p-2">
  <div class="modal-header border-0"><h5 class="modal-title" id="mTitle"></h5><button class="btn-close" data-bs-dismiss="modal"></button></div>
  <div class="modal-body">
    <label class="form-label small fw-semibold text-secondary">Việc cần làm</label><input class="form-control mb-3" id="fTitle">
    <label class="form-label small fw-semibold text-secondary">Nhóm môn <span class="fw-normal">(có thể bỏ trống)</span></label>
    <div class="input-group mb-3"><select class="form-select" id="fSub"></select><button class="btn btn-soft" type="button" data-act="subs" data-from="task" title="Quản lý nhóm môn"><i class="bi bi-gear"></i></button></div>
    <div class="row g-2 mb-3"><div class="col-12 col-sm-5"><label class="form-label small fw-semibold text-secondary">Ngày</label><input type="date" class="form-control" id="fDate"></div>
    <div class="col-6 col-sm-3"><label class="form-label small fw-semibold text-secondary">Bắt đầu</label><input type="time" class="form-control" id="fS"></div>
    <div class="col-6 col-sm-4"><label class="form-label small fw-semibold text-secondary">Kết thúc</label><input type="time" class="form-control" id="fE"></div></div>
    <label class="form-label small fw-semibold text-secondary">Ghi chú</label><input class="form-control" id="fNote">
  </div>
  <div class="modal-footer border-0"><button class="btn btn-del me-auto d-none" id="bDel" data-act="del"><i class="bi bi-trash"></i> Xóa</button>
    <button class="btn btn-soft" data-bs-dismiss="modal">Hủy</button><button class="btn btn-main px-4" data-act="save">Lưu</button></div>
</div></div></div>

<!-- Modal quản lý nhóm môn -->
<div class="modal fade" id="mSubs" tabindex="-1"><div class="modal-dialog modal-dialog-centered"><div class="modal-content p-2">
  <div class="modal-header border-0"><h5 class="modal-title"><i class="bi bi-tags me-2"></i>Quản lý nhóm môn</h5><button class="btn-close" data-bs-dismiss="modal"></button></div>
  <div class="modal-body">
    <div class="input-group mb-3"><input class="form-control" id="sNew" placeholder="Tên nhóm mới, ví dụ: Complete IELTS"><button class="btn btn-main" data-act="subadd"><i class="bi bi-plus-lg"></i> Thêm</button></div>
    <div id="sList"></div>
    <small class="text-secondary d-block mt-2">Xóa nhóm không làm mất các việc đã gán nhóm đó.</small>
  </div>
  <div class="modal-footer border-0"><button class="btn btn-soft" data-bs-dismiss="modal">Xong</button></div>
</div></div></div>

<!-- Modal nhập Excel -->
<div class="modal fade" id="mImp" tabindex="-1"><div class="modal-dialog modal-dialog-centered modal-lg"><div class="modal-content p-2">
  <div class="modal-header border-0"><h5 class="modal-title"><i class="bi bi-file-earmark-excel me-2"></i>Nhập nhanh bằng Excel</h5><button class="btn-close" data-bs-dismiss="modal"></button></div>
  <div class="modal-body">
    <div class="d-flex align-items-center gap-2 mb-3 flex-wrap"><span class="badge rounded-pill text-bg-light">1</span> Tải file mẫu, điền các việc rồi lưu lại
      <button class="btn btn-soft btn-sm ms-auto" data-act="tpl"><i class="bi bi-download me-1"></i>Tải file mẫu (.xlsx)</button></div>
    <div class="d-flex align-items-center gap-2 mb-2"><span class="badge rounded-pill text-bg-light">2</span> Chọn file đã điền (.xlsx, .xls, .csv)</div>
    <input type="file" class="form-control mb-3" id="impFile" accept=".xlsx,.xls,.csv">
    <div id="impPrev"></div>
  </div>
  <div class="modal-footer border-0"><button class="btn btn-soft" data-bs-dismiss="modal">Hủy</button><button class="btn btn-main px-4" id="bImp" data-act="impgo" disabled>Nhập</button></div>
</div></div></div>

<!-- Modal đổi mật khẩu -->
<div class="modal fade" id="mPw" tabindex="-1"><div class="modal-dialog modal-dialog-centered"><div class="modal-content p-2">
  <div class="modal-header border-0"><h5 class="modal-title"><i class="bi bi-key me-2"></i>Đổi mật khẩu</h5><button class="btn-close" data-bs-dismiss="modal"></button></div>
  <div class="modal-body" id="pwBody"></div>
  <div class="modal-footer border-0"><button class="btn btn-soft" data-bs-dismiss="modal">Hủy</button><button class="btn btn-main px-4" id="bPw" data-act="pwsave">Cập nhật</button></div>
</div></div></div>

<!-- Modal chi tiết ngày (lịch tháng) -->
<div class="modal fade" id="mDay" tabindex="-1"><div class="modal-dialog modal-dialog-centered"><div class="modal-content p-2">
  <div class="modal-header border-0"><h5 class="modal-title text-pu" id="dTitle"></h5><button class="btn-close" data-bs-dismiss="modal"></button></div>
  <div class="modal-body" id="dBody"></div>
  <div class="modal-footer border-0"><button class="btn btn-main me-auto" data-act="dayadd"><i class="bi bi-plus-lg"></i> Thêm việc</button><button class="btn btn-soft" data-bs-dismiss="modal">Đóng</button></div>
</div></div></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="shared.js"></script>
<script>
const pad = n => String(n).padStart(2, '0');
const iso = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const P = s => { const [a, b, c] = s.split('-'); return new Date(a, b - 1, c) };
const add = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x };
const mon = d => add(d, -((d.getDay() + 6) % 7));
const vn = s => { const [a, b, c] = s.split('-'); return `${c}/${b}/${a}` };
const dow = s => { const g = P(s).getDay(); return g ? 'Thứ ' + (g + 1) : 'Chủ nhật' };
const tm = s => s ? (+s.slice(0, 2)) * 60 + (+s.slice(3, 5)) : null;
const ST = { todo: 'Chưa làm', doing: 'Đang làm', done: 'Đã xong', skip: 'Bỏ qua' };
const TABS = { today: 'Hôm nay', week: 'Tuần này', month: 'Tháng này', list: 'Checklist', stats: 'Thống kê' };
const S = { mo: new Date(new Date().getFullYear(), new Date().getMonth(), 1), day: null, after: null, reopenDay: false, user: null, tasks: [], subs: [], log: [], logDate: '', fired: new Set(), ch: [], sd: null, sr: '30', last: 'today', tab: 'today', ws: mon(new Date()), f: '', m: null, imp: [], back: false, openSubs: false, draft: null };
const mTask = new bootstrap.Modal('#mTask'), mPw = new bootstrap.Modal('#mPw'), mSubs = new bootstrap.Modal('#mSubs'), mImp = new bootstrap.Modal('#mImp');
const mDay = new bootstrap.Modal('#mDay');

const day = ds => S.tasks.filter(t => t.date === ds);
const stat = a => { const n = a.filter(t => t.status !== 'skip').length, d = a.filter(t => t.status === 'done').length; return { n, d, l: n - d, p: n ? Math.round(d / n * 100) : 0 } };
const time = t => t.t_start ? t.t_start + (t.t_end ? '–' + t.t_end : '') : 'Cả ngày';
const open_ = t => t.status === 'todo' || t.status === 'doing';
const first = () => (S.user.user_metadata?.name || S.user.email.split('@')[0]).trim().split(' ').pop();
const hello = () => { const h = new Date().getHours(); return h < 11 ? 'Chào buổi sáng' : h < 14 ? 'Chào buổi trưa' : h < 18 ? 'Chào buổi chiều' : 'Chào buổi tối' };
const sel = t => `<select class="form-select form-select-sm st st-${t.status}" data-act="st" data-id="${t.id}">${Object.entries(ST).map(([k, v]) => `<option value="${k}" ${k === t.status ? 'selected' : ''}>${v}</option>`).join('')}</select>`;
const bar = p => `<div class="progress" style="height:8px"><div class="progress-bar" style="width:${p}%"></div></div>`;
const PAL = [['#e1ecfd', '#3c6fb0'], ['#fde3ec', '#b0486b'], ['#d8f2e3', '#2e7a54'], ['#ffeccf', '#a8701f'], ['#ece6fb', '#6a55a0'], ['#dff3f5', '#2c7f8a']];
const chip = n => { if (!n) return ''; let h = 0; for (const c of n) h = (h * 31 + c.charCodeAt(0)) % 97; const p = PAL[h % PAL.length]; return `<span class="sbj" style="background:${p[0]};color:${p[1]}">${esc(n)}</span>` };
const actBtns = td => `<button class="btn btn-main" data-act="add" data-id="${td}"><i class="bi bi-plus-lg"></i> Thêm việc</button><button class="btn btn-soft" data-act="imp"><i class="bi bi-file-earmark-excel"></i> Nhập Excel</button>`;

/* ---------- Nhật ký thông báo: lưu theo ngày, qua ngày là xóa sạch ---------- */
const LK = () => 'sp_log_' + S.user.id;
const nowHM = () => { const n = new Date(); return pad(n.getHours()) + ':' + pad(n.getMinutes()) };
function loadLog() {
  let o = null; try { o = JSON.parse(localStorage.getItem(LK())) } catch { }
  const td = iso(new Date()); if (!o || o.d !== td) o = { d: td, items: [], fired: [] };
  S.log = o.items; S.logDate = o.d; S.fired = new Set(o.fired);
}
function saveLog() { try { localStorage.setItem(LK(), JSON.stringify({ d: S.logDate, items: S.log.slice(0, 60), fired: [...S.fired] })) } catch { } }
function dayRoll() { const td = iso(new Date()); if (S.logDate !== td) { S.log = []; S.fired = new Set(); S.logDate = td; saveLog() } }
function logAdd(x) { dayRoll(); S.log.unshift({ at: nowHM(), ...x }); S.log = S.log.slice(0, 60); saveLog(); head() }
const TI = { reminder: 'bell-fill', warning: 'exclamation-triangle-fill', info: 'info-circle-fill', success: 'check-circle-fill', danger: 'x-circle-fill' };
function notify(msg, type = 'info', o = {}) { toast(msg, type, o); logAdd({ icon: TI[type], text: (o.title ? o.title + ' · ' : '') + msg }) }

/* ---------- Thông báo (chuông) ---------- */
function notes() {
  const n = new Date(), td = iso(n), m = n.getHours() * 60 + n.getMinutes(), a = day(td), r = [], s = stat(a);
  if (s.l > 0) r.push(['pin-angle-fill', `Hôm nay còn ${s.l} việc chưa xong`]);

/* ---------- Nhóm môn ---------- */
function drawSubs() { $('#sList').innerHTML = S.subs.length ? S.subs.map(s => `<div class="d-flex align-items-center justify-content-between py-1">${chip(s.name)}<button class="btn btn-sm btn-del" data-act="subdel" data-id="${s.id}"><i class="bi bi-trash"></i></button></div>`).join('') : '<div class="text-secondary">Chưa có nhóm nào. Nhóm môn có thể bỏ trống khi thêm việc.</div>' }
async function addSub() {
  const name = $('#sNew').value.trim(); if (!name) return;
  if (S.subs.some(s => s.name.toLowerCase() === name.toLowerCase())) return toast('Nhóm này đã có rồi', 'warning');
  const { error } = await sb.from('subjects').insert({ name }); if (error) throw error;
  await loadSubs(); drawSubs(); $('#sNew').value = ''; if (S.back && S.draft) S.draft.subject = name; toast(`Đã thêm nhóm “${name}”`);
}

/* ---------- Excel ---------- */
const stMap = s => { s = String(s || '').toLowerCase(); return /xong|done|hoàn/.test(s) ? 'done' : /đang|doing/.test(s) ? 'doing' : /bỏ|skip/.test(s) ? 'skip' : 'todo' };
function pDate(v) {
  if (v == null || v === '') return null;
  if (typeof v === 'number') { const d = new Date(Math.round((v - 25569) * 864e5)); return `${d.getUTCFullYear()}-${pad(d.getUTCMonth() + 1)}-${pad(d.getUTCDate())}` }
  const s = String(v).trim(); let m = s.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{4})$/); if (m) return `${m[3]}-${pad(m[2])}-${pad(m[1])}`;
  m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/); return m ? `${m[1]}-${pad(m[2])}-${pad(m[3])}` : null;
}
function pTime(v) {
  if (v == null || v === '') return '';
  if (typeof v === 'number') { const x = Math.round((v % 1) * 1440); return `${pad(Math.floor(x / 60) % 24)}:${pad(x % 60)}` }
  const m = String(v).match(/(\d{1,2})[:hH](\d{2})/); return m ? `${pad(m[1])}:${m[2]}` : '';
}
function tpl() {
  const d0 = new Date(), f = d => `${pad(d.getDate())}/${pad(d.getMonth() + 1)}/${d.getFullYear()}`;
  const ws = XLSX.utils.aoa_to_sheet([
    ['Ngày (dd/mm/yyyy)', 'Giờ bắt đầu', 'Giờ kết thúc', 'Việc cần làm', 'Nhóm môn', 'Trạng thái', 'Ghi chú'],
    [f(d0), '07:40', '08:10', 'Ôn từ vựng Complete IELTS', 'Complete IELTS', 'Chưa làm', 'Ví dụ: ôn 30 từ'],
    [f(d0), '14:00', '15:30', 'Luyện Listening / Speaking', 'Complete IELTS', 'Chưa làm', ''],
    [f(add(d0, 1)), '20:00', '20:45', 'Làm bài tập đại học GE3', 'Bài tập đại học', 'Đang làm', ''],
    [f(add(d0, 2)), '', '', 'Việc cả ngày, không có giờ, không có nhóm', '', 'Bỏ qua', '']]);
  ws['!cols'] = [{ wch: 18 }, { wch: 12 }, { wch: 12 }, { wch: 42 }, { wch: 20 }, { wch: 12 }, { wch: 28 }];
  const g = XLSX.utils.aoa_to_sheet([['HƯỚNG DẪN'], ['• Giữ nguyên dòng tiêu đề ở sheet "Study Planner", mỗi dòng là một việc.'], ['• Ngày và Việc cần làm là bắt buộc. Giờ và Nhóm môn có thể để trống.'], ['• Ngày nhập dạng dd/mm/yyyy (ví dụ 22/10/2026). Giờ nhập dạng 07:40.'], ['• Trạng thái: Chưa làm / Đang làm / Đã xong / Bỏ qua (để trống = Chưa làm).'], ['• Nhóm môn chưa có sẽ được tự tạo khi nhập.']]);
  g['!cols'] = [{ wch: 80 }];
  const wb = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, ws, 'Study Planner'); XLSX.utils.book_append_sheet(wb, g, 'Hướng dẫn');
  XLSX.writeFile(wb, 'mau-study-planner.xlsx'); toast('Đã tải file mẫu', 'info');
}
function impPrev() {
  const r = S.imp, ok = r.filter(x => x.date && x.title), bad = r.length - ok.length;
  $('#impPrev').innerHTML = `<div class="mb-2"><span class="badge text-bg-success me-1">${ok.length} dòng hợp lệ</span>${bad ? `<span class="badge text-bg-danger">${bad} dòng thiếu ngày/việc sẽ bị bỏ qua</span>` : ''}</div>
<div class="table-responsive" style="max-height:240px"><table class="table table-sm align-middle mb-0"><thead><tr><th>Ngày</th><th>Giờ</th><th>Việc</th><th>Nhóm</th><th>Trạng thái</th></tr></thead><tbody>
${r.slice(0, 40).map(x => `<tr class="${x.date && x.title ? '' : 'table-danger'}"><td>${x.date ? vn(x.date) : '—'}</td><td>${time(x)}</td><td>${esc(x.title) || '—'}</td><td>${esc(x.subject)}</td><td>${ST[x.status]}</td></tr>`).join('')}</tbody></table></div>${r.length > 40 ? `<small class="text-secondary">… và ${r.length - 40} dòng nữa</small>` : ''}`;
  $('#bImp').disabled = !ok.length; $('#bImp').textContent = `Nhập ${ok.length} việc`;
}
$('#impFile').addEventListener('change', async e => {
  const f = e.target.files[0]; if (!f) return;
  try {
    const wb = XLSX.read(await f.arrayBuffer(), { type: 'array' }), ws = wb.Sheets[wb.SheetNames[0]];
    const rows = XLSX.utils.sheet_to_json(ws, { header: 1, raw: true, defval: '' }).slice(1).filter(r => r.some(c => c !== ''));
    S.imp = rows.map(r => ({ date: pDate(r[0]), t_start: pTime(r[1]), t_end: pTime(r[2]), title: String(r[3] || '').trim(), subject: String(r[4] || '').trim(), status: stMap(r[5]), note: String(r[6] || '').trim() }));
    if (!S.imp.length) { $('#impPrev').innerHTML = ''; $('#bImp').disabled = true; return toast('File không có dòng dữ liệu nào', 'warning') }
    impPrev();
  } catch (err) { toast('Không đọc được file: ' + err.message, 'danger') }
});
async function doImport() {
  const ok = S.imp.filter(x => x.date && x.title), btn = $('#bImp'); btn.disabled = true;
  try {
    const have = new Set(S.subs.map(s => s.name)), nw = [...new Set(ok.map(x => x.subject).filter(x => x && !have.has(x)))];
    if (nw.length) { const { error } = await sb.from('subjects').insert(nw.map(name => ({ name }))); if (error) throw error }
    for (let i = 0; i < ok.length; i += 300) { const { error } = await sb.from('tasks').insert(ok.slice(i, i + 300)); if (error) throw error }
    mImp.hide(); await Promise.all([load(), loadSubs()]); render(); notify(`Đã nhập ${ok.length} việc từ Excel 📥`, 'success');
  } catch (err) { toast(err.message, 'danger'); btn.disabled = false }
}

/* ---------- Nhắc nhở tự động ---------- */
const osNotify = (t, b) => { if ('Notification' in window && Notification.permission === 'granted') try { new Notification(t, { body: b }) } catch { } };
const askPerm = () => { if (!('Notification' in window)) return toast('Trình duyệt không hỗ trợ thông báo', 'warning'); Notification.requestPermission().then(p => toast(p === 'granted' ? 'Đã bật nhắc nhở trên máy 🔔' : 'Bạn chưa cho phép thông báo', p === 'granted' ? 'success' : 'warning')) };
const fire = k => { dayRoll(); if (S.fired.has(k)) return false; S.fired.add(k); saveLog(); return true };
function check() {
  const n = new Date(), m = n.getHours() * 60 + n.getMinutes();
  day(iso(n)).filter(open_).forEach(t => {
    const b = tm(t.t_start); if (b == null) return;
    if (m >= b && m < b + 10 && fire(t.id + ':s')) { notify(`${time(t)} · ${t.title}`, 'reminder', { title: 'Đến giờ học rồi! ⏰' }); osNotify('Đến giờ học rồi!', t.title) }
    else if (b - m > 0 && b - m <= 5 && fire(t.id + ':p')) { notify(`${t.title} (${time(t)})`, 'reminder', { title: `Còn ${b - m} phút nữa` }); osNotify(`Còn ${b - m} phút nữa`, t.title) }
  });
}
function greet() {
  if (sessionStorage.getItem('greeted')) return; sessionStorage.setItem('greeted', '1');
  const n = new Date(), td = iso(n), m = n.getHours() * 60 + n.getMinutes(), s = stat(day(td));
  const perm = 'Notification' in window && Notification.permission === 'default';
  notify(s.n ? `Hôm nay bạn có ${s.n} việc, còn ${s.l} việc chưa xong.` : 'Hôm nay chưa có việc nào, thêm kế hoạch nhé!', 'reminder', { title: `${hello()}, ${first()}! 👋`, action: perm ? { label: 'Bật nhắc nhở trên máy', fn: askPerm } : null });
  const od = S.tasks.filter(t => t.date < td && open_(t)).length, nx = day(td).find(t => open_(t) && tm(t.t_start) != null && tm(t.t_start) >= m);
  if (od) setTimeout(() => notify(`Bạn còn ${od} việc của những ngày trước chưa hoàn thành.`, 'warning'), 600);
  if (nx) setTimeout(() => notify(`${time(nx)} · ${nx.title}`, 'info', { title: 'Việc kế tiếp hôm nay' }), 1200);
}

/* ---------- Sự kiện ---------- */
document.addEventListener('click', async e => {
  const hn = e.target.closest('[data-hn]'); if (hn) { S.tab = hn.dataset.hn === 'stats' ? 'stats' : S.last; return render() }
  const tab = e.target.closest('[data-tab]'); if (tab) { S.tab = tab.dataset.tab; return render() }
  const el = e.target.closest('[data-act]'); if (!el) return;
  const a = el.dataset.act, id = el.dataset.id;
  if (['st', 'note', 'flt', 'mpick'].includes(a)) return;
  try {
    if (a === 'home') { S.tab = 'today'; render(); window.scrollTo(0, 0) }
    else if (a === 'cal') { S.tab = 'week'; S.ws = mon(new Date()); render() }
    else if (a === 'prev' || a === 'next') { S.ws = add(S.ws, a === 'next' ? 7 : -7); render() }
    else if (a === 'now') { S.ws = mon(new Date()); render() }
    else if (a === 'mprev' || a === 'mnext') { S.mo = new Date(S.mo.getFullYear(), S.mo.getMonth() + (a === 'mnext' ? 1 : -1), 1); render() }
    else if (a === 'sr') { S.sr = id; render() }
    else if (a === 'mnow') { const n = new Date(); S.mo = new Date(n.getFullYear(), n.getMonth(), 1); render() }
    else if (a === 'day') { S.day = id; drawDay(); mDay.show() }
    else if (a === 'dayadd') { S.reopenDay = true; S.after = () => openTask({ date: S.day, status: 'todo' }); mDay.hide() }
    else if (a === 'dayedit') { S.reopenDay = true; const t = { ...S.tasks.find(x => x.id == id) }; S.after = () => openTask(t); mDay.hide() }
    else if (a === 'add') { S.reopenDay = false; openTask({ date: id, status: 'todo' }) }
    else if (a === 'edit') { S.reopenDay = false; openTask({ ...S.tasks.find(t => t.id == id) }) }
    else if (a === 'save') {
      const t = readForm(), isEdit = !!t.id; delete t.id;
      if (!t.title || !t.date) return toast('Cần nhập tên việc và ngày', 'warning');
      const { error } = isEdit ? await sb.from('tasks').update(t).eq('id', S.m.id) : await sb.from('tasks').insert(t);
      if (error) throw error;
      mTask.hide(); await load(); render(); toast(isEdit ? 'Đã cập nhật việc ✨' : 'Đã thêm việc mới ✨');
    }
    else if (a === 'del') { const id2 = S.m.id; mTask.hide(); await delTask(id2) }
    else if (a === 'rm') await delTask(id);
    else if (a === 'undo') await restore(id);
    else if (a === 'subs') { drawSubs(); if (el.dataset.from === 'task') { S.draft = readForm(); S.back = true; S.openSubs = true; mTask.hide() } else { S.back = false; mSubs.show() } }
    else if (a === 'subadd') await addSub();
    else if (a === 'subdel') { const { error } = await sb.from('subjects').delete().eq('id', id); if (error) throw error; await loadSubs(); drawSubs(); render(); toast('Đã xóa nhóm', 'info') }
    else if (a === 'imp') { S.imp = []; $('#impFile').value = ''; $('#impPrev').innerHTML = ''; $('#bImp').disabled = true; $('#bImp').textContent = 'Nhập'; mImp.show() }
    else if (a === 'tpl') tpl();
    else if (a === 'impgo') await doImport();
    else if (a === 'perm') askPerm();
    else if (a === 'pw') {
      $('#pwBody').innerHTML = pw('pwOld', 'Mật khẩu hiện tại') + pw('pwNew', 'Mật khẩu mới', 'Tối thiểu 6 ký tự', 'new-password') + pw('pwNew2', 'Nhập lại mật khẩu mới', '', 'new-password');
      mPw.show();
    }
    else if (a === 'pwsave') {
      const o = $('#pwOld').value, n = $('#pwNew').value;
      if (!o || n.length < 6) return toast('Nhập mật khẩu hiện tại và mật khẩu mới (≥ 6 ký tự)', 'warning');
      if (n !== $('#pwNew2').value) return toast('Mật khẩu mới nhập lại chưa khớp', 'warning');
      if (n === o) return toast('Mật khẩu mới phải khác mật khẩu cũ', 'warning');
      const btn = $('#bPw'); btn.disabled = true;
      try {
        const chk = await sb.auth.signInWithPassword({ email: S.user.email, password: o });
        if (chk.error) throw new Error('Mật khẩu hiện tại không đúng');
        const { error } = await sb.auth.updateUser({ password: n }); if (error) throw error;
        mPw.hide(); toast('Đã đổi mật khẩu thành công 🔐');
      } finally { btn.disabled = false }
    }
    else if (a === 'out') { await sb.auth.signOut(); sessionStorage.clear(); location.replace('index.html') }
  } catch (err) { toast(viErr(err.message || 'Có lỗi xảy ra'), 'danger') }
});
document.addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.id === 'sNew') addSub().catch(err => toast(err.message, 'danger')) });
document.addEventListener('change', async e => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  const a = el.dataset.act, t = S.tasks.find(x => x.id == el.dataset.id);
  if (a === 'flt') { S.f = el.value; return render() }
  if (a === 'mpick') { if (el.value) { const [y, m] = el.value.split('-'); S.mo = new Date(+y, m - 1, 1); render() } return }
  try {
    if (a === 'st') { t.status = el.value; render(); const { error } = await sb.from('tasks').update({ status: t.status }).eq('id', t.id); if (error) throw error; toast(`Đã chuyển sang “${ST[t.status]}”`, t.status === 'done' ? 'success' : 'info') }
    else if (a === 'note') { t.note = el.value; const { error } = await sb.from('tasks').update({ note: t.note }).eq('id', t.id); if (error) throw error; toast('Đã lưu ghi chú', 'info') }
  } catch (err) { toast(err.message, 'danger') }
});

setInterval(() => {
  if (!S.user) return; check();
  if (S.tab === 'stats') head(); else if (!document.querySelector('.modal.show') && !/INPUT|SELECT/.test(document.activeElement.tagName)) render();
}, 30000);

/* ===== KHỞI ĐỘNG ===== */
(async () => {
  const t0 = Date.now();
  const { data } = await sb.auth.getSession();
  if (!data.session) return location.replace('index.html');
  S.user = data.session.user; loadLog();
  const nm = S.user.user_metadata?.name || S.user.email;
  $('#uName').textContent = nm; $('#uMail').textContent = S.user.email;
  await Promise.all([load(), loadSubs()]); render();
  setTimeout(() => { $('#loader').classList.add('hide'); setTimeout(() => $('#loader').remove(), 600); greet(); check() }, Math.max(0, 700 - (Date.now() - t0)));
  sb.auth.onAuthStateChange(ev => { if (ev === 'SIGNED_OUT') location.replace('index.html') });
})();
</script>
</body>
</html>
